name: Compilación automática

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: sudo apt-get update && sudo apt-get install -y build-essential valgrind

      - name: Compilar
        run: make

      - name: Ejecutar pruebas
        run: make run

      - name: Verificar memory leaks (valgrind)
        run: valgrind --leak-check=full --show-leak-kinds=all --track-origins=yes --error-exitcode=1 ./stands_app
